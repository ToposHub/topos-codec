[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topos-codec"
version = "0.1.0"
description = "Topos Video Codec — zero-dependency intra-frame mezzanine codec (ctypes bindings and encoder wrapper)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["video", "codec", "mezzanine", "intra-frame", "prores"]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Codecs",
]

[tool.setuptools]
packages = ["topos_codec"]
package-dir = {"" = "python"}

[tool.setuptools.package-data]
topos_codec = ["lib/*"]
